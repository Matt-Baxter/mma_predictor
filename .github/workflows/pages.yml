# Publishes web/ to GitHub Pages on every push.
#
# One-time setup, which only a repository admin can do:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# The workflow cannot do this for itself. `configure-pages` has an `enablement`
# option that tries, but the Actions token is refused with "Resource not
# accessible by integration" -- creating a Pages site needs admin rights that
# GITHUB_TOKEN is never granted.
#
# Once that setting is saved, every push deploys automatically to
# https://matt-baxter.github.io/mma_predictor/
name: Deploy web app to GitHub Pages

on:
  push:
    branches: ["claude/ufc-fight-prediction-nn-6z9hh1"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
