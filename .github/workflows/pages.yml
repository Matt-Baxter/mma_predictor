# Publishes web/ to GitHub Pages on every push.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# After that this runs on its own and the site lives at
# https://matt-baxter.github.io/mma_predictor/
name: Deploy web app to GitHub Pages

on:
  push:
    branches: ["claude/ufc-fight-prediction-nn-6z9hh1"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
