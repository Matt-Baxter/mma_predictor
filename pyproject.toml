[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mma-predictor"
version = "0.1.0"
description = "Independent UFC fight-outcome probabilities from a symmetric neural network"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mma-predict = "mma_predictor.predict:main"

[tool.setuptools.packages.find]
include = ["mma_predictor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
